<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>[Bridge+]비밀번호 재설정</title>
    <style type="text/css">
      @media screen and (max-width: 480px) {
        .email-container {
          width: 100% !important;
        }
        .button {
          width: 100% !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #ffffff; font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" width="100%" style="max-width: 388px;" class="email-container">
      <tr>
        <td align="center" style="padding: 40px 0;">
          <img src="https://hryedam-logo.s3.ap-northeast-2.amazonaws.com/logo_renewal.avif" alt="예담 로고" width="280" style="display: block; margin: auto;"/>
        </td>
      </tr>
      <tr>
        <td style="padding: 0 16px;">
          <h1 style="font-size: 20px; font-weight: 700; margin: 0; padding: 0 0 32px 0; color: #000000; text-align: center;">
            사용자 비밀번호 재설정
          </h1>
          <p style="font-size: 16px; line-height: 1.6; color: #000000; margin: 0; text-align: center; word-break: keep-all; word-wrap: break-word;">
            {{userName}}님<br /><br />
            비밀번호 재설정을 요청하셨습니다.<br />
            아래 버튼을 눌러 비밀번호를 변경해 주세요.<br />
          </p>
          
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 40px auto 20px auto; width: 100%;">
            <tr>
              <td align="center">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" class="button" style="width: 100%;">
                  <tr>
                    <td style="border-radius: 8px; background: #00A0E9; padding: 12px 0;">
                      <a href="{{activate_url}}" target="_blank" style="background: #00A0E9; border-radius: 8px; color: #ffffff; display: block; font-size: 16px; font-weight: 500; line-height: 24px; text-align: center; text-decoration: none; width: 100%;">비밀번호 재설정</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          
          <p style="font-size: 12px; color: #666666; text-align: center;">
            비밀번호 재설정을 요청하지 않으셨다면, 이 메일을 무시하세요.
          </p>
        </td>
      </tr>
      
      <tr>
        <td style="padding: 40px 0; text-align: center;">
          <img src="https://hryedam-logo.s3.ap-northeast-2.amazonaws.com/logo_renewal.avif" alt="예담 로고" width="80" style="display: block; margin: 0 auto;"/>
          <p style="font-size: 10px; line-height: 1.5; color: #666666; margin: 10px 0 0;">
            노무법인 예담HR컨설팅 | <a href="https://www.hryedam.co.kr" style="color: #666666;">https://www.hryedam.co.kr</a> | <a href="mailto:master@hryedam.co.kr" style="color: #666666;">master@hryedam.co.kr</a>
          </p>
          <p style="font-size: 10px; color: #666666; margin: 5px 0 0;">
            Copyright © 2025 노무법인 예담HR컨설팅, All rights reserved.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
