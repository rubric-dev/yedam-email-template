<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>[예담]회원가입 이메일 인증</title>
    <style type="text/css">
      @media screen and (max-width: 480px) {
        .email-container {
          width: 100% !important;
        }
        .button {
          width: 100% !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #ffffff; font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" width="100%" style="max-width: 388px;" class="email-container">
      <tr>
        <td align="center" style="padding: 40px 0;">
          <img src="https://hryedam-logo.s3.ap-northeast-2.amazonaws.com/logo.avif" alt="예담 로고" width="120" style="display: block; margin: auto;"/>
        </td>
      </tr>
      <tr>
        <td style="padding: 0 16px;">
          <h1 style="font-size: 20px; font-weight: 700; margin: 0; padding: 0 0 32px 0; color: #000000; text-align: center;">
            <span>예담</span> 회원가입을 환영합니다
          </h1>
          <p style="font-size: 16px; line-height: 1.6; color: #000000; margin: 0; text-align: center; word-break: keep-all; word-wrap: break-word;">
              예담 서비스를 사용해 주셔서 감사합니다.<br /><br />
              계정을 안전하게 활성화하기 위해서는<br />
              이메일 인증이 필요합니다.<br /><br />
              아래 버튼 클릭으로 이메일을 인증하여<br />
              회원가입을 완료 해주세요.
          </p>
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 40px auto 20px auto; width: 100%;">
            <tr>
              <td align="center">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" class="button" style="width: 100%;">
                  <tr>
                    <td style="border-radius: 8px; background: #00A0E9; padding: 12px 0;">
                      <a href="{{activate_url}}" target="_blank" style="background: #00A0E9; border-radius: 8px; color: #ffffff; display: block; font-size: 16px; font-weight: 500; line-height: 24px; text-align: center; text-decoration: none; width: 100%;">이메일 인증</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          <p style="font-size: 12px; color: #666666; text-align: center;">
            가입을 시도하지 않았는데 이 이메일이 도착했다면, 메일을 무시하세요.
          </p>
        </td>
      </tr>
      <tr>
        <td style="padding: 40px 0; text-align: center;">
          <img src="https://hryedam-logo.s3.ap-northeast-2.amazonaws.com/logo.avif" alt="예담 로고" width="50" style="display: block; margin: 0 auto;"/>
          <p style="font-size: 10px; line-height: 1.5; color: #666666; margin: 10px 0 0;">
            노무법인 예담HR컨설팅 | <a href="https://www.puffin.kr" style="color: #666666;">https://www.hryedam.co.kr</a> | <a href="mailto:master@hryedam.co.kr" style="color: #666666;">master@hryedam.co.kr</a>
          </p>
          <p style="font-size: 10px; color: #666666; margin: 5px 0 0;">
            Copyright © 2025 노무법인 예담HR컨설팅, All rights reserved.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
